document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        if (!entry.compressed && entry.mime.indexOf('image/') === 0) {
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' + entry.data;
          return;
        }
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ecoration: none;\" style-hover=\"color: #E07A5F;\">Why Gomed<\u002Fa>\n        <a href=\"ipc.html\" style=\"font-family: 'Source Sans 3', sans-serif; font-size: 14px; color: #636E72; text-decoration: none;\" style-hover=\"color: #E07A5F;\">Your IPC<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: center; gap: 14px;\">\n      <div style=\"width: 34px; height: 34px; border-radius: 50%; background: #E0D5C8; display: flex; align-items: center; justify-content: center; font-family: 'Source Sans 3', sans-serif; font-size: 13px; font-weight: 600; color: #8B7355; cursor: pointer;\">RK<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width: 1100px; margin: 0 auto; padding: 32px;\">\n  <!-- GREETING -->\n  <div style=\"margin-bottom: 32px;\">\n    <h1 style=\"font-family: 'Libre Baskerville', serif; font-size: 28px; color: #2D3436; font-weight: 400; margin-bottom: 6px;\">Welcome back, Rajesh<\u002Fh1>\n    <p style=\"font-family: 'Source Sans 3', sans-serif; font-size: 15px; color: #636E72;\">Here's an overview of your healthcare journey<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- SIDEBAR + MAIN LAYOUT -->\n  <div style=\"display: grid; grid-template-columns: 220px 1fr; gap: 24px;\">\n    \n    <!-- LEFT NAV -->\n    <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n      <sc-for list=\"{{ sideNavItems }}\" as=\"nav\" hint-placeholder-count=\"6\">\n        <div style=\"display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: {{ nav.bg }}; cursor: pointer; transition: background 0.15s;\" style-hover=\"background: rgba(224,122,95,0.06);\" onclick=\"{{ nav.onClick }}\">\n          <span style=\"font-size: 15px; width: 20px; text-align: center;\">{{ nav.icon }}<\u002Fspan>\n          <span style=\"font-family: 'Source Sans 3', sans-serif; font-size: 14px; font-weight: {{ nav.weight }}; color: {{ nav.color }};\">{{ nav.label }}<\u002Fspan>\n          <sc-if value=\"{{ nav.badge }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-left: auto; background: #E07A5F; color: white; border-radius: 10px; padding: 1px 7px; font-family: 'Source Sans 3', sans-serif; font-size: 11px; font-weight: 600;\">{{ nav.badgeCount }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <!-- MAIN CONTENT -->\n    <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n\n      <!-- Active trip banner -->\n      <sc-if value=\"{{ showActiveTrip }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background: linear-gradient(135deg, #2D3436 0%, #3D4F4F 100%); border-radius: 18px; padding: 28px 32px; display: flex; justify-content: space-between; align-items: center;\">\n          <div>\n            <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #E07A5F; margin-bottom: 8px;\">Active Journey<\u002Fdiv>\n            <div style=\"font-family: 'Libre Baskerville', serif; font-size: 22px; color: white; margin-bottom: 4px;\">Cardiac Bypass Surgery<\u002Fdiv>\n            <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 14px; color: rgba(255,255,255,0.5);\">Apollo Hospitals, Chennai · Dr. Rajesh Sharma<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align: right;\">\n            <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 30px; font-weight: 700; color: white;\">15<\u002Fdiv>\n            <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 12px; color: rgba(255,255,255,0.45);\">days until travel<\u002Fdiv>\n            <a href=\"package.html\" style=\"display: inline-block; margin-top: 10px; padding: 8px 18px; background: #E07A5F; border-radius: 20px; font-family: 'Source Sans 3', sans-serif; font-size: 13px; font-weight: 600; color: white; text-decoration: none; transition: background 0.2s;\" style-hover=\"background: #D4694F;\">View Details<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- Journey progress -->\n      <sc-if value=\"{{ showOverview }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background: white; border-radius: 16px; padding: 28px;\">\n          <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 13px; font-weight: 700; color: #2D3436; margin-bottom: 20px;\">Journey Progress<\u002Fdiv>\n          <div style=\"display: flex; gap: 0; align-items: flex-start;\">\n            <sc-for list=\"{{ journeySteps }}\" as=\"js\" hint-placeholder-count=\"5\">\n              <div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; position: relative;\">\n                <div style=\"width: 36px; height: 36px; border-radius: 50%; background: {{ js.bg }}; border: 2px solid {{ js.border }}; display: flex; align-items: center; justify-content: center; z-index: 1;\">\n                  <sc-if value=\"{{ js.completed }}\" hint-placeholder-val=\"{{ false }}\">\n                    <svg width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\"><path d=\"M3 8L6.5 11.5L13 4.5\" stroke=\"white\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ js.current }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"width: 8px; height: 8px; border-radius: 50%; background: #E07A5F;\"><\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 12px; font-weight: 500; color: {{ js.labelColor }}; margin-top: 8px; text-align: center;\">{{ js.label }}<\u002Fdiv>\n                <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 11px; color: #bbb; margin-top: 2px;\">{{ js.date }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- Upcoming tasks -->\n      <sc-if value=\"{{ showOverview }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background: white; border-radius: 16px; padding: 28px;\">\n          <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 13px; font-weight: 700; color: #2D3436; margin-bottom: 16px;\">Upcoming Tasks<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n            <sc-for list=\"{{ tasks }}\" as=\"task\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; align-items: center; gap: 14px; padding: 14px; background: #FBF7F2; border-radius: 12px; border-left: 3px solid {{ task.accentColor }};\">\n                <div style=\"flex: 1;\">\n                  <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 14px; font-weight: 600; color: #2D3436;\">{{ task.title }}<\u002Fdiv>\n                  <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 12px; color: #636E72; margin-top: 2px;\">{{ task.desc }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding: 6px 14px; border-radius: 8px; background: {{ task.btnBg }}; font-family: 'Source Sans 3', sans-serif; font-size: 12px; font-weight: 600; color: {{ task.btnColor }}; cursor: pointer; white-space: nowrap; transition: opacity 0.15s;\" style-hover=\"opacity: 0.85;\">{{ task.action }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- Documents section -->\n      <sc-if value=\"{{ showDocs }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background: white; border-radius: 16px; padding: 28px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;\">\n            <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 13px; font-weight: 700; color: #2D3436;\">My Documents<\u002Fdiv>\n            <div style=\"padding: 6px 14px; background: rgba(224,122,95,0.08); border-radius: 8px; font-family: 'Source Sans 3', sans-serif; font-size: 12px; font-weight: 600; color: #E07A5F; cursor: pointer;\">Upload New<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n            <sc-for list=\"{{ documents }}\" as=\"doc\" hint-placeholder-count=\"4\">\n              <div style=\"display: flex; align-items: center; gap: 12px; padding: 12px; background: #FBF7F2; border-radius: 10px;\">\n                <div style=\"width: 36px; height: 36px; border-radius: 8px; background: {{ doc.iconBg }}; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;\">{{ doc.icon }}<\u002Fdiv>\n                <div style=\"flex: 1;\">\n                  <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 14px; font-weight: 500; color: #2D3436;\">{{ doc.name }}<\u002Fdiv>\n                  <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 12px; color: #aaa;\">{{ doc.date }} · {{ doc.size }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 12px; color: #E07A5F; font-weight: 600; cursor: pointer;\">View<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- Messages section -->\n      <sc-if value=\"{{ showMessages }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background: white; border-radius: 16px; padding: 28px;\">\n          <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 13px; font-weight: 700; color: #2D3436; margin-bottom: 16px;\">Messages<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n            <sc-for list=\"{{ messages }}\" as=\"msg\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; gap: 12px; padding: 14px; background: {{ msg.bg }}; border-radius: 12px;\">\n                <div style=\"width: 40px; height: 40px; border-radius: 50%; background: {{ msg.avatarBg }}; display: flex; align-items: center; justify-content: center; font-family: 'Source Sans 3', sans-serif; font-size: 14px; font-weight: 600; color: {{ msg.avatarColor }}; flex-shrink: 0;\">{{ msg.initials }}<\u002Fdiv>\n                <div style=\"flex: 1;\">\n                  <div style=\"display: flex; justify-content: space-between; margin-bottom: 3px;\">\n                    <span style=\"font-family: 'Source Sans 3', sans-serif; font-size: 14px; font-weight: 600; color: #2D3436;\">{{ msg.from }}<\u002Fspan>\n                    <span style=\"font-family: 'Source Sans 3', sans-serif; font-size: 11px; color: #aaa;\">{{ msg.time }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 13px; color: #636E72; line-height: 1.5;\">{{ msg.text }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- Quick actions -->\n      <sc-if value=\"{{ showOverview }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;\">\n          <a href=\"search.html\" style=\"background: white; border-radius: 14px; padding: 22px; text-align: center; text-decoration: none; cursor: pointer; transition: box-shadow 0.2s, transform 0.15s;\" style-hover=\"box-shadow: 0 4px 16px rgba(0,0,0,0.06); transform: translateY(-2px);\">\n            <div style=\"font-size: 22px; margin-bottom: 8px;\">🔍<\u002Fdiv>\n            <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 14px; font-weight: 600; color: #2D3436;\">Find Treatment<\u002Fdiv>\n            <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 12px; color: #636E72; margin-top: 3px;\">Browse &amp; compare<\u002Fdiv>\n          <\u002Fa>\n          <div style=\"background: white; border-radius: 14px; padding: 22px; text-align: center; cursor: pointer; transition: box-shadow 0.2s, transform 0.15s;\" style-hover=\"box-shadow: 0 4px 16px rgba(0,0,0,0.06); transform: translateY(-2px);\">\n            <div style=\"font-size: 22px; margin-bottom: 8px;\">📹<\u002Fdiv>\n            <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 14px; font-weight: 600; color: #2D3436;\">Video Consult<\u002Fdiv>\n            <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 12px; color: #636E72; margin-top: 3px;\">Talk to a specialist<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: white; border-radius: 14px; padding: 22px; text-align: center; cursor: pointer; transition: box-shadow 0.2s, transform 0.15s;\" style-hover=\"box-shadow: 0 4px 16px rgba(0,0,0,0.06); transform: translateY(-2px);\">\n            <div style=\"font-size: 22px; margin-bottom: 8px;\">📞<\u002Fdiv>\n            <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 14px; font-weight: 600; color: #2D3436;\">Call Coordinator<\u002Fdiv>\n            <div style=\"font-family: 'Source Sans 3', sans-serif; font-size: 12px; color: #636E72; margin-top: 3px;\">Get instant help<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\n\nclass Component extends DCLogic {\n  state = { activeSection: 'overview' };\n\n  renderVals() {\n    const section = this.state.activeSection;\n    const navItems = [\n      { id: 'overview', icon: '📋', label: 'Overview', badge: false },\n      { id: 'trips', icon: '✈️', label: 'My Trips', badge: false },\n      { id: 'documents', icon: '📄', label: 'Documents', badge: false },\n      { id: 'messages', icon: '💬', label: 'Messages', badge: true, badgeCount: '2' },\n      { id: 'settings', icon: '⚙️', label: 'Settings', badge: false },\n    ];\n\n    const sideNavItems = navItems.map(n => ({\n      ...n,\n      bg: section === n.id ? 'rgba(224,122,95,0.08)' : 'transparent',\n      weight: section === n.id ? '600' : '400',\n      color: section === n.id ? '#E07A5F' : '#636E72',\n      onClick: () => this.setState({ activeSection: n.id }),\n    }));\n\n    const showOverview = section === 'overview' || section === 'trips';\n    const showActiveTrip = section === 'overview' || section === 'trips';\n    const showDocs = section === 'documents';\n    const showMessages = section === 'messages';\n\n    const journeySteps = [\n      { label: \"Booked\", date: \"28 Jun\", completed: true, current: false, bg: \"#0D9488\", border: \"#0D9488\", labelColor: \"#0D9488\" },\n      { label: \"Teleconsult\", date: \"2 Jul\", completed: true, current: false, bg: \"#0D9488\", border: \"#0D9488\", labelColor: \"#0D9488\" },\n      { label: \"Pre-op\", date: \"12 Jul\", completed: false, current: true, bg: \"white\", border: \"#E07A5F\", labelColor: \"#E07A5F\" },\n      { label: \"Travel\", date: \"15 Jul\", completed: false, current: false, bg: \"white\", border: \"#ddd\", labelColor: \"#bbb\" },\n      { label: \"Recovery\", date: \"22 Jul\", completed: false, current: false, bg: \"white\", border: \"#ddd\", labelColor: \"#bbb\" },\n    ];\n\n    const tasks = [\n      { title: \"Upload blood test results\", desc: \"Required before 10 July\", accentColor: \"#E07A5F\", action: \"Upload\", btnBg: \"#E07A5F\", btnColor: \"white\" },\n      { title: \"Confirm travel date\", desc: \"Currently set: 15 July 2026\", accentColor: \"#0D9488\", action: \"Confirm\", btnBg: \"rgba(13,148,136,0.1)\", btnColor: \"#0D9488\" },\n      { title: \"Complete insurance form\", desc: \"For claim processing\", accentColor: \"#B8942E\", action: \"Fill Form\", btnBg: \"rgba(184,148,46,0.1)\", btnColor: \"#B8942E\" },\n      { title: \"Pre-operative video call\", desc: \"Scheduled: 12 July, 3:00 PM\", accentColor: \"#0D9488\", action: \"Join Call\", btnBg: \"rgba(13,148,136,0.1)\", btnColor: \"#0D9488\" },\n    ];\n\n    const documents = [\n      { name: \"Angiography Report\", date: \"20 Jun 2026\", size: \"2.4 MB\", icon: \"📊\", iconBg: \"rgba(224,122,95,0.1)\" },\n      { name: \"ECG Report\", date: \"18 Jun 2026\", size: \"1.1 MB\", icon: \"📈\", iconBg: \"rgba(13,148,136,0.1)\" },\n      { name: \"Blood Test Results\", date: \"15 Jun 2026\", size: \"890 KB\", icon: \"🩸\", iconBg: \"rgba(107,91,141,0.1)\" },\n      { name: \"Insurance Card\", date: \"10 Jun 2026\", size: \"340 KB\", icon: \"🏥\", iconBg: \"rgba(184,148,46,0.1)\" },\n    ];\n\n    const messages = [\n      { from: \"Dr. Rajesh Sharma\", initials: \"RS\", text: \"Your reports look good. We can proceed with the scheduled date. Please ensure fasting 12 hours before pre-op tests.\", time: \"2h ago\", bg: \"rgba(224,122,95,0.03)\", avatarBg: \"#E0D5C8\", avatarColor: \"#8B7355\" },\n      { from: \"Meera (Care Coordinator)\", initials: \"MC\", text: \"I've booked your airport transfer. The driver will meet you at arrivals with a Gomed placard. Hotel confirmation attached.\", time: \"5h ago\", bg: \"#FBF7F2\", avatarBg: \"#D4E6DC\", avatarColor: \"#4A8B6E\" },\n      { from: \"Apollo Hospitals\", initials: \"AH\", text: \"Your pre-operative appointment is confirmed for 12 July at 10:00 AM. Please bring all original reports.\", time: \"1d ago\", bg: \"#FBF7F2\", avatarBg: \"#DDD5E8\", avatarColor: \"#6B5B8D\" },\n    ];\n\n    return { sideNavItems, showOverview, showActiveTrip, showDocs, showMessages, journeySteps, tasks, documents, messages };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
